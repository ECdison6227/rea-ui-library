<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading inspiration · Layout reference</title><link rel="stylesheet" href="style.css"><style>
.main{margin-left:6px}.topbar{padding-left:16px;gap:6px}.topbar a{color:inherit;text-decoration:none;font-size:16px;line-height:24px}.gallery-tabs{display:flex;gap:4px;padding:8px 16px;position:sticky;top:0;background:var(--paper);z-index:2;overflow-x:auto}.gallery-tabs button{padding:0 12px;height:36px;white-space:nowrap;border-radius:100px}.gallery-tabs [aria-selected=true]{background:var(--fill)}.masonry{columns:5;column-gap:16px;padding:8px 16px 120px}.gallery-card{break-inside:avoid;position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--fill2);margin-bottom:16px;aspect-ratio:var(--ratio)}.cover{padding:26px;position:absolute;inset:0;background:var(--cover);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}.cover h2{font-family:Georgia,serif;font-size:clamp(20px,2.1vw,34px);font-weight:400;line-height:1.1;letter-spacing:-1px;margin:0;max-width:80%}.cover small{font-size:10px;letter-spacing:2px}.cover:after{content:'';display:block;width:70%;aspect-ratio:1;border:1px solid currentColor;opacity:.4;border-radius:50%;align-self:flex-end;margin-top:10px}.gallery-card .category{position:absolute;top:8px;left:8px;height:32px;min-width:32px;padding:6px 10px;border-radius:20px;color:white;background:#0004;font-size:12px;line-height:20px}.gallery-card .save{position:absolute;right:8px;top:8px;background:#fff;border-radius:26px;padding:6px 10px;opacity:0;transform:scale(.96);transition:opacity .15s,transform .15s}.gallery-card:hover .save,.gallery-card:focus-within .save{opacity:1;transform:scale(1)}.gallery-card:hover{box-shadow:0 4px 16px #0000001a}.gallery-card .saved{opacity:1}.caption{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:24px;background:var(--paper);box-shadow:0 4px 16px #0002;font-size:12px;color:var(--secondary);z-index:4;text-align:center;max-width:90vw}@media(max-width:1200px){.masonry{columns:4}}@media(max-width:900px){.masonry{columns:3}}@media(max-width:650px){.masonry{columns:2}.cover{padding:16px}.cover h2{font-size:22px}}@media(max-width:380px){.masonry{columns:1}}@media(hover:none){.gallery-card .save{opacity:1}}
</style></head><body><main class="main"><header class="topbar"><a href="../index.html">◫ Reading inspiration</a></header><nav class="gallery-tabs" role="tablist" aria-label="Categories"></nav><section class="masonry" aria-label="Reading inspiration cards"></section></main><div class="caption">D layout reference · source geometry / independent covers · <a href="../comparison/index.html">Compare evidence</a></div><div class="toast" hidden role="status"></div><script>
const data=[['Ways of seeing','Design','#c2cabc','#2c423a','3/4'],['A quiet place','Essays','#d4c8b7','#4c3930','16/9'],['Form & feeling','Design','#d0b7b2','#573b3c','3/4'],['Field notes','Research','#212b28','#d8ddce','4/3'],['The patient reader','Essays','#d7c99e','#3d3823','16/9'],['Small systems','Technology','#c5c9d1','#303d55','1/1'],['A useful life','Design','#eee9df','#685b3d','16/9'],['The shape of time','Research','#c3c6bb','#3d452d','4/3'],['Learning to notice','Essays','#aea58f','#f8f1db','3/4'],['Good questions','Research','#3e453e','#d5d8c2','16/9'],['Less, but better','Design','#d8d7d1','#3c413d','1/1'],['Beyond the screen','Technology','#afbfc1','#28454a','3/4']];
const tabs=['Featured','Design','Essays','Research','Technology'];let selected='Featured';
function render(){document.querySelector('.gallery-tabs').innerHTML=tabs.map(t=>`<button role="tab" aria-selected="${t===selected}" data-tab="${t}">${t}</button>`).join('');document.querySelector('.masonry').innerHTML=data.filter(d=>selected==='Featured'||d[1]===selected).map(([title,category,bg,ink,ratio])=>`<article class="gallery-card" style="--ratio:${ratio};--cover:${bg};--ink:${ink}"><div class="cover"><small>READING ROOM</small><h2>${title}</h2></div><span class="category">${category}</span><button class="save" aria-label="Save ${title}">＋ Save</button></article>`).join('')}
document.addEventListener('click',e=>{if(e.target.dataset.tab){selected=e.target.dataset.tab;render()}if(e.target.classList.contains('save')){e.target.textContent='✓ Saved';e.target.classList.add('saved');e.target.disabled=true;document.querySelector('.toast').textContent='Saved for this gallery session';document.querySelector('.toast').hidden=false;setTimeout(()=>document.querySelector('.toast').hidden=true,2400)}});render();
</script></body></html>
